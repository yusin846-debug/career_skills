<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>Peer gallery responsive QA</title><style>body{font:14px sans-serif;background:#eee}iframe{height:740px;border:1px solid #aaa}button{padding:10px;margin:6px}pre{white-space:pre-wrap}</style><select id="width"><option>360</option><option selected>390</option><option>768</option></select><button id="start">사진 시작</button><button id="next">스크롤 +240</button><button id="report">검사</button><pre id="result"></pre><iframe id="view" width="390" src="/index.html#peers"></iframe><script>const f=document.querySelector('#view');document.querySelector('#width').onchange=e=>f.style.width=e.target.value+'px';document.querySelector('#start').onclick=()=>{const w=f.contentWindow;w.scrollTo(0,w.document.querySelector('.peer-stack-gallery').getBoundingClientRect().top+w.scrollY-w.innerHeight*.1)};document.querySelector('#next').onclick=()=>f.contentWindow.scrollBy(0,240);document.querySelector('#report').onclick=()=>{const w=f.contentWindow,d=w.document;document.querySelector('#result').textContent=JSON.stringify({width:w.innerWidth,pageWidth:d.documentElement.scrollWidth,photos:d.querySelectorAll('.peer-photo').length,upper:d.querySelectorAll('.peer-album figure').length,stack:d.querySelector('.peer-stack-count').textContent,sticky:w.getComputedStyle(d.querySelector('.peer-stack-sticky')).position,broken:[...d.querySelectorAll('#peers img')].filter(i=>i.complete&&!i.naturalWidth).length},null,2)};</script>
